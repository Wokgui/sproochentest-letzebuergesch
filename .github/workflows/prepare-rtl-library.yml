name: Préparer bibliothèque RTL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer les journaux RTL manquants
        env:
          RTL_LIMIT: '3'
        run: python scripts/prepare_rtl_library.py
      - name: Enregistrer les VTT dans l'application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rtl-vtt || true
          if git diff --cached --quiet; then
            echo 'Aucun nouveau journal'
          else
            git commit -m 'Ajoute sous-titres LU préparés pour journaux RTL'
            git push
          fi
