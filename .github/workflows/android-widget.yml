name: Build Android timetable widget

on:
  push:
    branches:
      - android-widget-build
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/emploi-du-temps-widget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/emploi-du-temps-widget.apk"
          if gh release view edt-widget-v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload edt-widget-v1.0 "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create edt-widget-v1.0 "$APK" \
              --target "$GITHUB_SHA" \
              --title "Emploi du temps widget v1.0" \
              --notes "Widget Android 4×2 : cours actuel, prochain cours, compte à rebours, progression de la journée et actualisation automatique."
          fi
