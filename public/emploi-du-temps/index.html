<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mon emploi du temps</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--active:#dcfce7;--active-border:#16a34a;--break:#f3f4f6}
    @media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#141a22;--text:#f3f4f6;--muted:#9ca3af;--line:#2b3543;--accent:#60a5fa;--active:#052e16;--active-border:#22c55e;--break:#111827}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:820px;margin:auto;padding:16px 14px 32px}h1{font-size:1.35rem;margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}#clock{font-size:1.8rem;font-weight:800}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}#status{font-size:1.08rem;font-weight:800;margin-top:4px}#substatus{font-size:.92rem;margin-top:4px;color:var(--muted)}.progress-label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:6px}.bar{height:14px;background:var(--break);border:1px solid var(--line);border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .4s ease}.bar2 .fill{background:var(--active-border)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.section-title h2{font-size:1rem;margin:0}.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 12px;font:inherit;white-space:nowrap}.tabs button.selected{background:var(--accent);color:#fff;border-color:var(--accent)}.course{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.course:first-child{border-top:0}.course.active{margin:0 -8px;padding:12px 8px;border:2px solid var(--active-border);border-radius:14px;background:var(--active)}.time{font-weight:800}.cls{font-weight:750;line-height:1.25}.room{font-weight:800;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:5px 8px}.empty{padding:18px 0;text-align:center;color:var(--muted)}.week{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:.78rem}th,td{border:1px solid var(--line);padding:6px;vertical-align:top}th{background:var(--break);position:sticky;top:0}td.today,th.today{outline:2px solid var(--accent);outline-offset:-2px}.mini{font-weight:700}.small{font-size:.72rem;color:var(--muted)}.install-note{font-size:.82rem;line-height:1.35}@media(max-width:460px){.app{padding:12px 10px 24px}#clock{font-size:1.5rem}.course{grid-template-columns:62px 1fr auto;gap:8px}.room{padding:4px 6px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>Emploi du temps</h1><div id="date" class="muted"></div></div><div id="clock">--:--</div></div>
  <div class="card"><div class="muted">Maintenant</div><div id="status">Calcul…</div><div id="substatus"></div></div>
  <div class="card"><div class="progress-label"><span>Progression de la journée (8 h → 18 h)</span><span id="dayPct">0 %</span></div><div class="bar"><div id="dayFill" class="fill"></div></div><div style="height:12px"></div><div class="progress-label"><span>Cours effectués aujourd’hui</span><span id="coursePct">0 / 0</span></div><div class="bar bar2"><div id="courseFill" class="fill"></div></div></div>
  <div class="section-title"><h2 id="dayTitle">Aujourd’hui</h2><span id="dayCount" class="muted"></span></div><div id="tabs" class="tabs"></div><div id="todayList" class="card"></div>
  <div class="section-title"><h2>Semaine complète</h2></div><div class="card week"><div id="weekTable"></div></div>
  <div class="card install-note"><strong>Installation Android :</strong> dans Chrome → menu ⋮ → <strong>Installer l’application</strong> ou <strong>Ajouter à l’écran d’accueil</strong>.</div>
</div>
<script>
const SCHEDULE={"1":[{"start":"08:00","end":"09:00","class":"4G1 ALL · 4G2 ALL","room":"217"},{"start":"10:00","end":"11:00","class":"6G3BIL · 6G4BIL","room":"217"},{"start":"11:00","end":"12:00","class":"4G3 ALL · 4G4 ALL","room":"217"},{"start":"13:00","end":"14:00","class":"5G1-2-3 ALL","room":"216"}],"2":[{"start":"08:00","end":"09:00","class":"5G4 ALL","room":"217"},{"start":"09:00","end":"10:00","class":"4G3 ALL · 4G4 ALL","room":"217"},{"start":"14:00","end":"15:00","class":"3G3 ALL · 3G4 ALL","room":"216"},{"start":"16:00","end":"17:00","class":"3G1 ALL · 3G2 ALL","room":"216"}],"3":[],"4":[{"start":"08:00","end":"09:00","class":"3G1 ALL · 3G2 ALL","room":"216"},{"start":"09:00","end":"10:00","class":"3G3 ALL · 3G4 ALL","room":"216"},{"start":"10:00","end":"11:00","class":"6G3BIL · 6G4BIL","room":"216"},{"start":"11:00","end":"12:00","class":"5G4 ALL","room":"216"},{"start":"13:00","end":"14:00","class":"6G3BIL · 6G4BIL","room":"216"},{"start":"14:00","end":"15:00","class":"4G1 ALL · 4G2 ALL","room":"215"},{"start":"16:00","end":"17:00","class":"5G1-2-3 ALL","room":"217"}],"5":[{"start":"11:00","end":"12:00","class":"5G1-2-3 ALL","room":"217"},{"start":"13:00","end":"14:00","class":"5G4 ALL","room":"217"},{"start":"14:00","end":"15:00","class":"3G3 ALL · 3G4 ALL","room":"217"},{"start":"15:00","end":"16:00","class":"4G3 ALL · 4G4 ALL","room":"217"},{"start":"16:00","end":"17:00","class":"4G1 ALL · 4G2 ALL","room":"217"}]};
const DAY_NAMES=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],SHORT=["Lun","Mar","Mer","Jeu","Ven"];let selectedDay=null;
const toMin=hm=>{const[h,m]=hm.split(":").map(Number);return h*60+m},pad=n=>String(n).padStart(2,"0"),currentMinutes=d=>d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
function fmtDuration(mins){mins=Math.max(0,Math.ceil(mins));const h=Math.floor(mins/60),m=mins%60;return h&&m?`${h} h ${m} min`:h?`${h} h`:`${m} min`}
function renderTabs(now){const box=document.getElementById("tabs");box.innerHTML="";for(let d=1;d<=5;d++){const b=document.createElement("button");b.type="button";b.textContent=DAY_NAMES[d];if(d===selectedDay)b.classList.add("selected");b.addEventListener("click",()=>{selectedDay=d;renderDay(now);renderTabs(now)});box.appendChild(b)}}
function renderDay(now){const d=selectedDay,list=SCHEDULE[d]||[],box=document.getElementById("todayList"),mins=currentMinutes(now);document.getElementById("dayTitle").textContent=d===now.getDay()?"Aujourd’hui":DAY_NAMES[d];document.getElementById("dayCount").textContent=list.length?`${list.length} cours`:"Aucun cours";box.innerHTML="";if(!list.length){box.innerHTML='<div class="empty">Aucun cours prévu.</div>';return}list.forEach(c=>{const row=document.createElement("div");row.className="course";if(d===now.getDay()&&mins>=toMin(c.start)&&mins<toMin(c.end))row.classList.add("active");row.innerHTML=`<div class="time">${c.start}<br><span class="muted">${c.end}</span></div><div><div class="cls">${c.class}</div><div class="small">ALLEMAND</div></div><div class="room">${c.room}</div>`;box.appendChild(row)})}
function renderWeek(now){let html="<table><thead><tr><th>Heure</th>";for(let d=1;d<=5;d++)html+=`<th class="${d===now.getDay()?"today":""}">${SHORT[d-1]}</th>`;html+="</tr></thead><tbody>";for(let h=8;h<18;h++){html+=`<tr><th>${pad(h)}:00</th>`;for(let d=1;d<=5;d++){const c=(SCHEDULE[d]||[]).find(x=>toMin(x.start)===h*60);html+=`<td class="${d===now.getDay()?"today":""}">${c?`<div class="mini">${c.class}</div><div class="small">Salle ${c.room}</div>`:""}</td>`}html+="</tr>"}document.getElementById("weekTable").innerHTML=html+"</tbody></table>"}
function nextSchoolDay(now){for(let add=0;add<8;add++){const d=new Date(now);d.setDate(now.getDate()+add);const dow=d.getDay();if(dow>=1&&dow<=5&&(SCHEDULE[dow]||[]).length){if(add===0){const mins=currentMinutes(now),future=(SCHEDULE[dow]||[]).find(c=>toMin(c.end)>mins);if(future)return{date:d,day:dow,course:future}}else return{date:d,day:dow,course:SCHEDULE[dow][0]}}}return null}
function update(){const now=new Date(),dow=now.getDay(),mins=currentMinutes(now),list=SCHEDULE[dow]||[];document.getElementById("clock").textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;document.getElementById("date").textContent=now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});const dayProgress=Math.min(1,Math.max(0,(mins-480)/600));document.getElementById("dayFill").style.width=(dayProgress*100).toFixed(1)+"%";document.getElementById("dayPct").textContent=Math.round(dayProgress*100)+" %";let completed=0,partial=0;list.forEach(c=>{const s=toMin(c.start),e=toMin(c.end);if(mins>=e){completed++;partial++}else if(mins>s&&mins<e)partial+=(mins-s)/(e-s)});document.getElementById("courseFill").style.width=((list.length?partial/list.length:0)*100).toFixed(1)+"%";document.getElementById("coursePct").textContent=list.length?`${completed} / ${list.length}`:"—";const current=list.find(c=>mins>=toMin(c.start)&&mins<toMin(c.end)),next=list.find(c=>toMin(c.start)>mins),status=document.getElementById("status"),sub=document.getElementById("substatus");if(current){status.textContent=`${current.class} · salle ${current.room}`;sub.textContent=`Cours en cours · encore ${fmtDuration(toMin(current.end)-mins)} · fin à ${current.end}`}else if(next){status.textContent=`Prochain : ${next.class} · salle ${next.room}`;sub.textContent=`À ${next.start} · dans ${fmtDuration(toMin(next.start)-mins)}`}else{const n=nextSchoolDay(now);if(dow>=1&&dow<=5&&list.length&&mins>=toMin(list[list.length-1].end)){status.textContent="Cours terminés pour aujourd’hui";sub.textContent=n&&n.date.toDateString()!==now.toDateString()?`Prochain cours : ${DAY_NAMES[n.day]} à ${n.course.start} · ${n.course.class}`:""}else if(!list.length){status.textContent="Pas de cours aujourd’hui";sub.textContent=n?`Prochain cours : ${DAY_NAMES[n.day]} à ${n.course.start} · ${n.course.class}`:""}else{status.textContent="Avant le premier cours";sub.textContent=`Premier cours à ${list[0].start} · ${list[0].class}`}}if(selectedDay===null)selectedDay=(dow>=1&&dow<=5)?dow:1;renderTabs(now);renderDay(now);renderWeek(now)}
update();setInterval(update,30000);if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
